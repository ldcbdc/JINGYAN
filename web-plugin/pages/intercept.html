<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>净眼已拦截此风险网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      background: #d93025;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content {
      width: min(680px, 100%);
      padding: 48px 56px 52px;
    }

    .icon-wrap {
      width: 70px;
      height: 64px;
      margin-bottom: 32px;
      position: relative;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
    }

    .icon-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #fff;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    }

    .icon-wrap span {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      color: #d93025;
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    .desc {
      font-size: 15px;
      color: rgba(255,255,255,0.92);
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .desc strong {
      color: #fff;
      font-weight: 700;
    }

    .desc a {
      color: #fff;
      text-decoration: underline;
      cursor: pointer;
    }

    .learn-more {
      color: #fff;
      text-decoration: underline;
      cursor: pointer;
    }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 40px;
      font-size: 14px;
      color: rgba(255,255,255,0.88);
      line-height: 1.6;
    }

    .notice-mark {
      margin-top: 3px;
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.72);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    .notice a {
      color: #fff;
      text-decoration: underline;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-link {
      font-size: 14px;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      padding: 8px 0;
    }

    .detail-link:hover {
      text-decoration: underline;
    }

    .btn-back {
      display: inline-block;
      height: 36px;
      padding: 0 24px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-back:hover {
      background: rgba(255,255,255,0.18);
    }

    .continue-link {
      display: inline-block;
      margin-top: 14px;
      color: rgba(255,255,255,0.9);
      font-size: 13px;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
      background: transparent;
      border: 0;
      font-family: inherit;
      padding: 0;
    }

    .continue-link:hover {
      color: #fff;
    }

    .detail-panel {
      display: none;
      background: rgba(0,0,0,0.15);
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 24px;
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      line-height: 1.8;
    }

    .detail-panel.show {
      display: block;
    }

    .detail-panel .row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }

    .detail-panel .label {
      color: rgba(255,255,255,0.6);
    }

    .detail-panel .value {
      font-weight: 600;
      word-break: break-all;
      text-align: right;
      max-width: 65%;
    }

    .detail-panel .value.danger {
      color: #ffab91;
    }
  </style>
</head>
<body>
  <div class="content">
  <div class="icon-wrap">
    <span>!</span>
  </div>

  <h1>净眼已拦截此风险网站</h1>
  <p class="desc">
    <strong id="site-domain">--</strong> 可能会诱导您进行充值、转账、付款或输入验证码等危险操作。攻击者可能借此盗取资金、账号密码、手机号或银行卡信息。<a class="learn-more" id="learn-more-link">了解详情</a>
  </p>

  <div class="detail-panel" id="detail-panel">
    <div class="row">
      <span class="label">拦截时间</span>
      <span class="value" id="time">--</span>
    </div>
    <div class="row">
      <span class="label">风险等级</span>
      <span class="value danger" id="risk-level">高危 · 疑似诈骗网站</span>
    </div>
    <div class="row">
      <span class="label">检测引擎</span>
      <span class="value">净眼 · AI 反诈引擎</span>
    </div>
    <div class="row">
      <span class="label">威胁类型</span>
      <span class="value" id="threat-type">仿冒网站 / 资金操作风险</span>
    </div>
    <div class="row">
      <span class="label">检测线索</span>
      <span class="value" id="risk-evidence">--</span>
    </div>
    <div class="row">
      <span class="label">建议</span>
      <span class="value" id="risk-suggestion">不要输入密码、验证码，也不要继续付款或转账。</span>
    </div>
    <button class="continue-link" id="btn-continue" type="button">无视风险，继续访问此网站</button>
  </div>

  <div class="notice">
    <span class="notice-mark">i</span>
    <span>净眼根据当前网址、页面内容和资金操作线索进行本地风险判断。继续访问可能导致账号、验证码或资金信息泄露。</span>
  </div>

  <div class="bottom-bar">
    <a class="detail-link" id="toggle-detail">详细信息</a>
    <button class="btn-back" id="btn-back">返回安全页面</button>
  </div>

  </div>
  <script src="warning.js"></script>
</body>
</html>
